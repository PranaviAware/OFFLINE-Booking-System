# ==============================================================================
# Office Link - Spring Boot Application Configuration
# ==============================================================================

# Server Configuration
server.port=5000

# Application Name
spring.application.name=officelink-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:office_link}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# Keycloak OIDC - OAuth2 Resource Server Configuration
# Spring auto-fetches Keycloak's public keys from JWKS URI to validate RS256 JWTs
# ==============================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/officelink}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/officelink/protocol/openid-connect/certs}

# Keycloak realm/client config (used for role extraction and CORS)
officelink.keycloak.realm=${KEYCLOAK_REALM:officelink}
officelink.keycloak.client-id=${KEYCLOAK_CLIENT_ID:officelink-frontend}
officelink.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8080}

# CORS Client Origin
officelink.client.origin=${CLIENT_ORIGIN:http://localhost:5173}

# Logging
logging.level.com.officelink=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG

